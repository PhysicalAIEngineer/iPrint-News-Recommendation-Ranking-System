name: Model Validation
on:
  workflow_dispatch:
  push:
    paths:
      - training/**
      - src/**
      - Notebook/**
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install fastapi==0.115.6 pydantic==2.10.6 prometheus-client==0.21.1 orjson==3.10.12 redis==5.2.1 SQLAlchemy==2.0.36 psycopg2-binary==2.9.10 pytest==8.3.4 httpx==0.28.1 ruff==0.9.2
      - run: python -m compileall api src training dashboard tests
      - run: pytest -q
