services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      MODEL_VERSION: baseline-v1
      ARTIFACT_ROOT: artifacts
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      API_URL: http://api:8000
      MODEL_VERSION: baseline-v1
    ports:
      - "8501:8501"
    depends_on:
      - api

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5000:5000"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iprint
      POSTGRES_USER: iprint
      POSTGRES_PASSWORD: iprint
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  mlflow_data:
  postgres_data:
  grafana_data:
